<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마라톤 노선 관리</title>
<meta name="description" content="전국 버스정류장으로 마라톤 코스를 만들고 공유합니다">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="src/theme.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>

<div id="map"></div>

<!-- 상단 -->
<div class="topbar">
  <div class="search-wrap">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" style="color:var(--muted);flex:0 0 auto">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" placeholder="정류장 검색 — 예: 합정역" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div class="select select--chip" id="region-picker"></div>
  <button class="icon-btn" id="theme-btn" title="테마 전환" aria-label="테마 전환">◐</button>
</div>

<!-- 노선 패널 -->
<div class="panel" id="panel">
  <div class="panel-head">
    <span class="viewer-badge">👁 보기 전용으로 공유된 노선</span>
    <div class="select" id="route-picker"></div>
    <input class="route-name" id="route-name" value="새 노선" placeholder="노선 이름">
    <div class="dirty" id="dirty" hidden>● 편집 중 — 저장된 노선은 그대로입니다</div>
    <div class="stats">
      <div class="stat"><div class="v" id="stat-km">0<small>km</small></div><div class="k">총 거리</div></div>
      <div class="stat"><div class="v" id="stat-n">0</div><div class="k">정류장</div></div>
      <div class="stat"><div class="v" id="stat-time">0<small>분</small></div><div class="k">예상 (10km/h)</div></div>
    </div>
    <div class="hint">정류장을 직선으로 이은 거리입니다. 실제 주행 거리보다 짧습니다.</div>
  </div>

  <div class="list" id="list"></div>

  <div class="panel-foot">
    <button class="btn ghost" id="btn-share">공유 링크</button>
    <button class="btn ghost editor-only" id="btn-export">내보내기</button>
    <button class="btn editor-only" id="btn-save">노선 저장</button>
    <button class="btn ghost" id="btn-copy-mine" style="display:none">내 노선으로 복사</button>
  </div>
</div>

<!-- 거점 모드 -->
<div class="compose" id="compose">
  <h4>거점을 찍으면 사이 정류장이 자동으로 채워집니다</h4>
  <p id="compose-status">지도를 클릭해 출발 → 경유 → 도착 순으로 찍으세요 (2개 이상)</p>
  <div class="slider-row">
    <label for="gap">정류장 간격</label>
    <input type="range" id="gap" min="100" max="1000" step="50" value="250">
    <output id="gap-out">250m</output>
  </div>
  <div class="compose-actions">
    <button class="btn ghost" id="btn-wp-undo">되돌리기</button>
    <button class="btn ghost" id="btn-wp-clear">거점 지우기</button>
    <button class="btn ghost" id="btn-wp-append" disabled hidden>뒤에 이어 붙이기</button>
    <button class="btn" id="btn-wp-apply" disabled>이대로 확정</button>
  </div>
</div>

<!-- 하단 툴바 -->
<div class="toolbar">
  <button class="tool" id="tool-compose">✛ 거점 찍기</button>
  <button class="tool" id="tool-undo">↩ 실행 취소</button>
  <button class="tool" id="tool-new">+ 새 노선</button>
  <button class="tool" id="tool-import">📂 불러오기</button>
  <button class="tool" id="tool-print">⎙ 인쇄</button>
  <button class="tool" id="tool-delete">🗑 삭제</button>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<div class="toast" id="toast"></div>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    <p id="loading-msg">정류장 데이터를 불러오는 중…</p>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
