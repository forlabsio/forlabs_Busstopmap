<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>마라톤 노선 관리</title>
<meta name="description" content="전국 버스정류장으로 마라톤 코스를 만들고 공유합니다">
<meta name="theme-color" content="#3182f6">
<!-- 지도 타일 서버에 미리 연결해 둔다 (모바일에서 왕복 시간이 크다) -->
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin>
<link rel="dns-prefetch" href="https://tiles.basemaps.cartocdn.com">

<!-- 지도 엔진은 같은 출처에서 받는다 (외부 CDN 왕복 제거) -->
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>

<link rel="stylesheet" href="src/theme.css?v=20261014163437">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
</head>
<body>

<div id="map"></div>

<!-- 상단: 검색과 지역 필터만 -->
<div class="topbar">
  <div class="search-wrap">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.4" style="color:var(--muted);flex:0 0 auto">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="search" placeholder="정류장 검색 — 예: 합정역" autocomplete="off">
      <kbd>⌘K</kbd>
    </div>
    <div class="results" id="results"></div>
  </div>
  <div class="select select--chip" id="region-picker"></div>
</div>

<button class="panel-toggle" id="panel-toggle" title="패널 접기" aria-expanded="true">›</button>

<!-- 노선 패널 (모바일에서는 바텀시트) -->
<div class="panel" id="panel">
  <button class="sheet-handle" id="sheet-handle" aria-label="패널 크기 조절"></button>

  <div class="panel-head">
    <span class="viewer-badge" id="viewer-badge">보기 전용으로 공유된 노선</span>

    <div class="head-row">
      <div class="select" id="route-picker"></div>
      <button class="icon-sm editor-only" id="menu-btn" title="더보기"
              aria-haspopup="menu" aria-expanded="false">⋯</button>
    </div>

    <div class="name-row">
      <button class="color-dot editor-only" id="color-btn" title="노선 색상 바꾸기"></button>
      <h2 class="route-title" id="route-title">새 노선</h2>
      <button class="icon-xs editor-only" id="rename-btn" title="이름 변경">✎</button>
      <input class="route-name" id="route-name" value="새 노선" placeholder="노선 이름" hidden>
    </div>
    <div class="palette" id="palette" hidden></div>

    <div class="stats">
      <div class="stat"><div class="v" id="stat-km">0<small>km</small></div><div class="k">총 거리</div></div>
      <div class="stat"><div class="v" id="stat-n">0</div><div class="k">정류장</div></div>
      <div class="stat"><div class="v" id="stat-time">0<small>분</small></div><div class="k">예상 (10km/h)</div></div>
    </div>

    <div class="meta-row">
      <span class="hint">정류장을 직선으로 이은 거리입니다.</span>
      <button class="undo-btn editor-only" id="tool-undo" hidden
              title="마지막 편집을 되돌립니다 (⌘Z)">↩ 실행 취소</button>
    </div>
    <div class="dirty" id="dirty" hidden>● 편집 중 — 저장된 노선은 그대로입니다</div>
    <div class="sync-state" id="sync-state" hidden></div>
  </div>

  <!-- 평소: 정류장 목록 -->
  <div class="list" id="list"></div>

  <!-- 전체 노선 보기 -->
  <div class="routes" id="routes-list" hidden></div>

  <!-- 코스 자동 만들기 중: 목록 자리를 대신한다 -->
  <div class="compose" id="compose" hidden>
    <h4>지도에서 지점을 찍어주세요</h4>
    <p id="compose-status">출발 → 경유 → 도착 순으로 2곳 이상 찍으면 사이 정류장이 자동으로 채워집니다.</p>
    <div class="slider-row">
      <label for="gap">정류장 간격</label>
      <input type="range" id="gap" min="100" max="1000" step="50" value="250">
      <output id="gap-out">250m</output>
    </div>
    <div class="compose-actions">
      <button class="btn ghost" id="btn-wp-undo">마지막 지점 취소</button>
      <button class="btn ghost" id="btn-wp-clear">전부 지우기</button>
    </div>
  </div>

  <div class="panel-foot">
    <div class="foot-row editor-only" id="foot-default">
      <button class="btn ghost" id="btn-share">공유 링크</button>
      <button class="btn" id="btn-save">노선 저장</button>
    </div>
    <div class="foot-row viewer-only" id="foot-viewer" hidden>
      <button class="btn ghost" id="btn-print-viewer">코스 인쇄</button>
    </div>
    <div class="foot-row" id="foot-compose" hidden>
      <button class="btn ghost" id="btn-wp-append" disabled hidden>뒤에 이어 붙이기</button>
      <button class="btn" id="btn-wp-apply" disabled>이대로 확정</button>
    </div>
  </div>
</div>

<!-- 더보기 메뉴 (모바일에서는 하단 액션시트) -->
<div class="menu-backdrop" id="menu-backdrop" hidden></div>
<div class="menu" id="menu" role="menu" hidden>
  <div class="menu-group menu-group--head">
    <span>만들기</span>
    <button class="menu-icon" id="theme-btn" aria-pressed="false" title="어두운 테마로 전환">
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <button role="menuitem" id="tool-compose">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
    <span>코스 자동 만들기</span>
  </button>
  <button role="menuitem" id="tool-new">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <span>새 노선</span>
  </button>

  <div class="menu-group">보기</div>
  <button role="menuitem" id="tool-overlay" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    <span>전체 노선</span>
    <i class="menu-check">✓</i>
  </button>
  <div class="menu-group">파일</div>
  <button role="menuitem" id="btn-export">
    <svg viewBox="0 0 24 24"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M4 19h16"/></svg>
    <span>내보내기</span>
  </button>
  <button role="menuitem" id="tool-import">
    <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M4 19h16"/></svg>
    <span>가져오기</span>
  </button>
  <button role="menuitem" id="tool-editkey">
    <svg viewBox="0 0 24 24"><path d="M15 7a4 4 0 11-3.8 5.2L7 16.4 5 18l-2-2 1.6-2 4.2-4.2A4 4 0 0115 7z"/></svg>
    <span>편집 권한</span>
  </button>
  <button role="menuitem" id="tool-print">
    <svg viewBox="0 0 24 24"><path d="M7 9V4h10v5"/><path d="M5 9h14v7H5z"/><path d="M7 16h10v4H7z"/></svg>
    <span>인쇄</span>
  </button>

  <hr>
  <button role="menuitem" class="danger" id="tool-delete">
    <svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>
    <span>노선 삭제</span>
  </button>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<div class="data-pending" id="data-pending" hidden>정류장 불러오는 중…</div>

<!-- 편집 권한 입력 (브라우저가 prompt를 막는 경우가 있어 앱 안에서 받는다) -->
<div class="modal-backdrop" id="key-backdrop" hidden></div>
<div class="modal" id="key-modal" hidden role="dialog" aria-modal="true" aria-labelledby="key-title">
  <h3 id="key-title">편집 권한</h3>
  <p>키를 넣으면 이 기기에서 노선을 수정하고 서버에 저장할 수 있습니다.<br>
     키 없이도 보기는 가능합니다.</p>
  <input id="key-input" type="text" inputmode="text" autocomplete="off"
         autocapitalize="off" spellcheck="false" placeholder="편집 권한 키">
  <div class="modal-msg" id="key-msg" hidden></div>
  <div class="modal-actions">
    <button class="btn ghost" id="key-clear">읽기 전용으로</button>
    <button class="btn ghost" id="key-cancel">취소</button>
    <button class="btn" id="key-save">확인</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    <p id="loading-msg">정류장 데이터를 불러오는 중…</p>
  </div>
</div>

<script type="module" src="src/app.js?v=20261014163437"></script>
</body>
</html>
