<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상단바 / 툴바 배치 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="../src/theme.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  body { overflow: hidden; }
  #switcher {
    position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #0f172a; color: #fff;
    display: flex; align-items: center; gap: 6px; padding: 0 16px; z-index: 200; font-size: 13px;
  }
  #switcher b { margin-right: 10px; opacity: .9; }
  #switcher button {
    background: rgba(255,255,255,.08); color: #fff; border: 0; padding: 7px 14px;
    border-radius: 999px; font-family: var(--font); font-size: 13px; cursor: pointer; font-weight: 600;
  }
  #switcher button.on { background: #fff; color: #0f172a; }
  #switcher .note { margin-left: auto; opacity: .6; font-size: 12px; }
  #stage { position: fixed; top: 50px; left: 0; right: 0; bottom: 0; }
  #map { position: absolute; inset: 0; }

  /* 우측 상단 액션 레일 (B안) */
  .rail {
    position: absolute; top: 16px; right: 16px; z-index: 12; display: none; gap: 6px;
    background: var(--canvas); border: 1px solid var(--border); border-radius: var(--r-chip);
    padding: 5px; box-shadow: var(--shadow);
  }
  .rail.show { display: flex; }
  .rail button {
    border: 0; background: transparent; color: var(--body); font-size: 13px; font-weight: 600;
    padding: 9px 13px; border-radius: var(--r-chip); display: flex; gap: 6px; align-items: center;
    font-family: var(--font); white-space: nowrap;
  }
  .rail button:hover { background: var(--surface); }
  .rail button.primary { background: var(--primary); color: var(--on-primary); }

  /* 더보기 메뉴 */
  .more { position: relative; }
  .more-menu {
    position: absolute; top: calc(100% + 8px); right: 0; width: 210px; background: var(--canvas);
    border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px;
  }
  .more-menu div {
    padding: 10px 11px; border-radius: 8px; font-size: 13.5px; color: var(--body); font-weight: 500;
    display: flex; gap: 9px; align-items: center;
  }
  .more-menu div:hover { background: var(--surface); }
  .more-menu div.danger { color: var(--danger); }
  .more-menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 7px; }

  .panel { top: 80px; }
  .panel-head .row { display: flex; align-items: center; gap: 8px; }
  .icon-sm {
    width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--surface);
    color: var(--body); font-size: 14px; display: grid; place-items: center; flex: 0 0 auto;
  }
  .icon-sm:hover { background: var(--surface-2); }
  .panel-foot { flex-direction: column; gap: 7px; }
  .panel-foot .row { display: flex; gap: 7px; width: 100%; }
  .btn-wide { width: 100%; }
  .badge-note { font-size: 11px; color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="switcher">
  <b>배치안</b>
  <button data-v="a" class="on">A · 현재</button>
  <button data-v="b">B · 우측 상단 레일</button>
  <button data-v="c">C · 패널 통합</button>
  <span class="note">같은 화면 폭·같은 데이터로 비교 (29개 코스)</span>
</div>

<div id="stage">
  <div id="map"></div>

  <!-- 상단 -->
  <div class="topbar">
    <div class="search-wrap">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" style="color:var(--muted);flex:0 0 auto">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input placeholder="정류장 검색 — 예: 합정역" />
        <kbd>⌘K</kbd>
      </div>
    </div>
    <div class="select select--chip" id="chip-region">
      <button class="select-trigger" style="width:auto">
        <span class="select-label">전국</span>
        <svg class="select-caret" width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>
    <button class="icon-btn" id="theme-top">☾</button>
  </div>

  <!-- B안: 우측 상단 레일 -->
  <div class="rail" id="rail">
    <button class="primary">✨ 코스 자동 만들기</button>
    <button>↩ 실행 취소</button>
    <button>⎙ 인쇄</button>
    <div class="more">
      <button id="more-btn">⋯</button>
      <div class="more-menu hidden" id="more-menu">
        <div>＋ 새 노선</div>
        <div>📂 파일에서 가져오기</div>
        <div>⬇ 내보내기</div>
        <hr>
        <div class="danger">🗑 이 노선 삭제</div>
      </div>
    </div>
  </div>

  <!-- 노선 패널 -->
  <div class="panel" id="panel">
    <div class="panel-head">
      <div class="row">
        <div class="select" id="panel-select" style="flex:1">
          <button class="select-trigger">
            <span class="select-label">상암월드컵공원 → 여의도공원</span>
            <svg class="select-caret" width="11" height="11" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="3"><path d="M5 9l7 7 7-7"/></svg>
          </button>
        </div>
        <button class="icon-sm panel-more hidden" id="panel-more">⋯</button>
      </div>
      <input class="route-name" value="상암월드컵공원 → 여의도공원 마라톤 코스" style="margin-top:10px">
      <div class="stats">
        <div class="stat"><div class="v">8.61<small>km</small></div><div class="k">총 거리</div></div>
        <div class="stat"><div class="v">29</div><div class="k">정류장</div></div>
        <div class="stat"><div class="v">52<small>분</small></div><div class="k">예상</div></div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="badge-note">정류장을 직선으로 이은 거리입니다.</span>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="panel-foot" id="foot"></div>
  </div>

  <!-- A안: 하단 툴바 -->
  <div class="toolbar" id="toolbar">
    <button class="tool">✨ 코스 자동 만들기</button>
    <button class="tool">↩ 실행 취소</button>
    <button class="tool">＋ 새 노선</button>
    <button class="tool">📂 파일에서 가져오기</button>
    <button class="tool">⎙ 인쇄</button>
    <button class="tool">🗑 이 노선 삭제</button>
  </div>
</div>

<script>
const SAMPLE = [
  ['월드컵경기장남측.월드컵공원', '0.00'], ['마포농수산물시장.월드컵경기장', '0.11'],
  ['마포구청.농수산물시장', '0.31'], ['마포구청.마포구청역', '0.45'], ['마포구청', '0.57'],
  ['마포구청.성산자동차검사소', '0.61'], ['망원동방울내길입구', '1.22'],
  ['망원시장.망원동월드컵시장입구', '1.59'], ['망원시장.망원동월드컵시장입구', '1.63'],
];

document.getElementById('list').innerHTML = SAMPLE.map(([n, km], i) => `
  <div class="item${i === 0 ? ' edge' : ''}">
    <span class="grip">⠿</span>
    <span class="num">${i + 1}</span>
    <span class="nm">${n}</span>${i === 0 ? '<span class="edge-tag">출발</span>' : ''}
    <span class="seg">${km}km</span>
  </div>`).join('');

const FOOT = {
  a: `<div class="row">
        <button class="btn ghost">공유 링크</button>
        <button class="btn ghost">내보내기</button>
        <button class="btn">노선 저장</button>
      </div>`,
  b: `<div class="row">
        <button class="btn ghost">공유 링크</button>
        <button class="btn">노선 저장</button>
      </div>`,
  c: `<button class="btn btn-wide">✨ 코스 자동 만들기</button>
      <div class="row">
        <button class="btn ghost">공유 링크</button>
        <button class="btn">노선 저장</button>
      </div>`,
};

function apply(v) {
  document.getElementById('toolbar').classList.toggle('hidden', v !== 'a');
  document.getElementById('rail').classList.toggle('show', v === 'b');
  document.getElementById('panel-more').classList.toggle('hidden', v !== 'c');
  document.getElementById('theme-top').classList.toggle('hidden', v === 'c');
  document.getElementById('foot').innerHTML = FOOT[v];
  document.querySelectorAll('#switcher button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('more-menu').classList.add('hidden');
}
document.querySelectorAll('#switcher button').forEach(b =>
  b.addEventListener('click', () => apply(b.dataset.v)));
document.getElementById('more-btn').addEventListener('click', () =>
  document.getElementById('more-menu').classList.toggle('hidden'));
document.getElementById('panel-more').addEventListener('click', () => {
  const m = document.getElementById('more-menu');
  m.classList.toggle('hidden');
  m.style.position = 'fixed'; m.style.top = '150px'; m.style.right = '24px';
});
apply('a');

fetch('../backups/marathon-routes-latest.json').then(r => r.json()).then(d => {
  const stops = d.routes.find(r => r.name.includes('마라톤')).stops;
  const lats = stops.map(s => s.lat), lngs = stops.map(s => s.lng);
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    bounds: [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
    fitBoundsOptions: { padding: { top: 110, bottom: 110, left: 90, right: 400 } },
    attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-left');
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  map.on('load', () => {
    map.getStyle().layers.filter(l => l.type === 'symbol').forEach(l => {
      try { map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get','name:ko'], ['get','name']]); } catch {}
    });
    const fc = { type: 'FeatureCollection', features: [
      { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: stops.map(s => [s.lng, s.lat]) } },
      ...stops.map((s, i) => ({ type: 'Feature',
        properties: { n: i + 1, edge: i === 0 || i === stops.length - 1 },
        geometry: { type: 'Point', coordinates: [s.lng, s.lat] } })),
    ]};
    map.addSource('route', { type: 'geojson', data: fc });
    map.addLayer({ id: 'c', type: 'line', source: 'route', filter: ['==', ['geometry-type'], 'LineString'],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': css('--canvas'), 'line-width': 9 } });
    map.addLayer({ id: 'l', type: 'line', source: 'route', filter: ['==', ['geometry-type'], 'LineString'],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': css('--primary'), 'line-width': 5 } });
    map.addLayer({ id: 'p', type: 'circle', source: 'route', filter: ['==', ['geometry-type'], 'Point'],
      paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 4.5, 13, 7, 16, 11],
               'circle-color': ['case', ['get','edge'], css('--primary'), css('--canvas')],
               'circle-stroke-width': 2.5, 'circle-stroke-color': css('--primary') } });
    map.addLayer({ id: 'n', type: 'symbol', source: 'route', minzoom: 11.5,
      filter: ['==', ['geometry-type'], 'Point'],
      layout: { 'text-field': ['to-string', ['get','n']], 'text-font': ['Open Sans Bold'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 12, 8.5, 14, 10, 16, 12] },
      paint: { 'text-color': ['case', ['get','edge'], css('--on-primary'), css('--primary')],
               'text-halo-color': ['case', ['get','edge'], css('--primary'), css('--canvas')],
               'text-halo-width': 1 } });
  });
});
</script>
</body>
</html>
