<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>노선 관리 리뉴얼 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root {
    --primary:#3182f6; --primary-hover:#2272eb; --on-primary:#fff;
    --canvas:#fff; --surface:#f2f4f6; --fg:#191f28; --body:#4e5968; --muted:#8b95a1;
    --border:#e5e8eb; --danger:#e42939; --tint:#e8f3ff;
    --r-card:16px; --r-btn:12px; --r-chip:999px; --shadow:0 4px 20px rgba(0,0,0,.08);
    --font:"Pretendard Variable",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--font); color:var(--fg); background:var(--surface);
         -webkit-font-smoothing:antialiased; }

  /* ── 시안 전환 바 ── */
  #switcher { position:fixed; top:0; left:0; right:0; height:52px; background:#0f172a; color:#fff;
              display:flex; align-items:center; gap:6px; padding:0 16px; z-index:100; font-size:13px; }
  #switcher b { font-size:13px; font-weight:700; margin-right:10px; opacity:.9; }
  #switcher button { background:rgba(255,255,255,.08); color:#fff; border:0; padding:7px 14px;
                     border-radius:999px; font-family:var(--font); font-size:13px; cursor:pointer; font-weight:600; }
  #switcher button.on { background:#fff; color:#0f172a; }
  #switcher .note { margin-left:auto; opacity:.55; font-size:12px; }

  /* ── 앱 본체 ── */
  #app { position:fixed; top:52px; left:0; right:0; bottom:0; background:var(--canvas); }
  #map { position:absolute; inset:0; }
  .maplibregl-ctrl-attrib { font-size:10px; }

  /* 상단 검색 */
  .topbar { position:absolute; top:16px; left:16px; right:16px; display:flex; gap:10px; z-index:10;
            pointer-events:none; }
  .topbar > * { pointer-events:auto; }
  .search { flex:1; max-width:420px; background:var(--canvas); border:1px solid var(--border);
            border-radius:var(--r-btn); box-shadow:var(--shadow); height:48px; display:flex;
            align-items:center; gap:10px; padding:0 16px; }
  .search input { border:0; outline:0; flex:1; font-family:var(--font); font-size:15px; color:var(--fg); background:transparent; }
  .search input::placeholder { color:var(--muted); }
  .chip { background:var(--canvas); border:1px solid var(--border); border-radius:var(--r-chip);
          height:48px; padding:0 18px; display:flex; align-items:center; gap:8px; font-size:14px;
          font-weight:600; color:var(--body); box-shadow:var(--shadow); cursor:pointer; }
  .chip.active { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }

  /* 노선 패널 */
  .panel { position:absolute; top:80px; right:16px; bottom:16px; width:352px; background:var(--canvas);
           border-radius:var(--r-card); box-shadow:var(--shadow); display:flex; flex-direction:column;
           overflow:hidden; z-index:10; border:1px solid var(--border); }
  .panel-head { padding:18px 20px 14px; border-bottom:1px solid var(--border); }
  .route-name { font-size:17px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .route-name span.edit { color:var(--muted); font-size:13px; font-weight:500; }
  .stats { display:flex; gap:18px; margin-top:12px; }
  .stat .v { font-size:21px; font-weight:700; letter-spacing:-.4px; }
  .stat .v small { font-size:12px; font-weight:600; color:var(--muted); margin-left:2px; }
  .stat .k { font-size:11px; color:var(--muted); margin-top:1px; font-weight:500; }
  .list { flex:1; overflow-y:auto; padding:8px 10px 10px; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px; }
  .item:hover { background:var(--surface); }
  .grip { color:var(--muted); font-size:13px; cursor:grab; letter-spacing:-2px; }
  .num { width:22px; height:22px; border-radius:var(--r-chip); background:var(--tint); color:var(--primary);
         font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .item.edge .num { background:var(--primary); color:var(--on-primary); }
  .nm { flex:1; font-size:13.5px; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .seg { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .x { color:var(--muted); font-size:13px; opacity:0; cursor:pointer; }
  .item:hover .x { opacity:1; }
  .panel-foot { padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:8px; }
  .btn { flex:1; height:44px; border:0; border-radius:var(--r-btn); font-family:var(--font);
         font-size:14px; font-weight:700; cursor:pointer; background:var(--primary); color:var(--on-primary); }
  .btn.ghost { background:var(--surface); color:var(--body); }

  /* 하단 툴바 */
  .toolbar { position:absolute; bottom:22px; left:50%; transform:translateX(-50%); display:flex; gap:4px;
             background:var(--canvas); border:1px solid var(--border); border-radius:var(--r-chip); padding:5px;
             box-shadow:var(--shadow); z-index:10; }
  .tool { border:0; background:transparent; font-family:var(--font); font-size:13px; font-weight:600;
          color:var(--body); padding:10px 16px; border-radius:var(--r-chip); cursor:pointer; display:flex; gap:6px; align-items:center; }
  .tool.on { background:var(--primary); color:var(--on-primary); }

  /* 지도 위 라벨 */
  .pin { background:var(--canvas); border:1px solid var(--border); border-radius:var(--r-chip);
         padding:5px 11px 5px 7px; font-size:12px; font-weight:700; box-shadow:var(--shadow);
         display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .pin i { width:8px; height:8px; border-radius:50%; background:var(--primary); display:block; }
  .pin.finish i { background:var(--danger); }
  .km { background:var(--primary); color:var(--on-primary); border-radius:var(--r-chip);
        padding:4px 10px; font-size:11px; font-weight:700; box-shadow:var(--shadow); }
</style>
</head>
<body>

<div id="switcher">
  <b>시안</b>
  <button data-t="toss" class="on">Toss</button>
  <button data-t="tmap">TMAP</button>
  <button data-t="komoot">komoot</button>
  <button data-t="citymapper">Citymapper</button>
  <button data-t="karrot">당근</button>
  <span class="note">oh-my-design.kr 토큰 적용 · 지도는 MapLibre 벡터 타일 · 실제 저장된 노선 데이터</span>
</div>

<div id="app">
  <div id="map"></div>

  <div class="topbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input placeholder="정류장 검색 — 예: 합정역, 여의도공원" />
      <span style="font-size:11px;color:var(--muted);font-weight:600">⌘K</span>
    </div>
    <div class="chip active">서울특별시 <span style="font-size:10px">▾</span></div>
    <div class="chip">16,980개 정류장</div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <div class="route-name">상암월드컵공원 → 여의도공원 <span class="edit">✎</span></div>
      <div class="stats">
        <div class="stat"><div class="v" id="s-km">9.7<small>km</small></div><div class="k">총 거리</div></div>
        <div class="stat"><div class="v" id="s-n">29</div><div class="k">정류장</div></div>
        <div class="stat"><div class="v">58<small>분</small></div><div class="k">예상 (10km/h)</div></div>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="panel-foot">
      <button class="btn ghost">내보내기</button>
      <button class="btn">노선 저장</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool on">✛ 정류장 찍기</button>
    <button class="tool">✎ 선 긋기</button>
    <button class="tool">↕ 순서 바꾸기</button>
    <button class="tool">⎙ 인쇄</button>
  </div>
</div>

<script>
const THEMES = {
  toss: { name:'Toss', primary:'#3182f6', hover:'#2272eb', onPrimary:'#fff', canvas:'#fff',
    surface:'#f2f4f6', fg:'#191f28', body:'#4e5968', muted:'#8b95a1', border:'#e5e8eb',
    danger:'#e42939', tint:'#e8f3ff', rCard:'16px', rBtn:'12px', rChip:'999px',
    shadow:'0 4px 20px rgba(0,0,0,.08)', basemap:'positron' },
  tmap: { name:'TMAP', primary:'#0064ff', hover:'#0052d4', onPrimary:'#fff', canvas:'#fff',
    surface:'#f1f8ff', fg:'#000000', body:'#464646', muted:'#777777', border:'#e5e5e5',
    danger:'#d22020', tint:'#f1f8ff', rCard:'8px', rBtn:'6px', rChip:'6px',
    shadow:'0 2px 12px rgba(0,0,0,.10)', basemap:'positron' },
  komoot: { name:'komoot', primary:'#4f6814', hover:'#404823', onPrimary:'#f5f3ec', canvas:'#faf9f4',
    surface:'#ede9de', fg:'#1c1a18', body:'#3b372f', muted:'#8a8275', border:'#e0dbce',
    danger:'#b53521', tint:'#e7e8d1', rCard:'16px', rBtn:'16px', rChip:'999px',
    shadow:'0 6px 24px rgba(28,26,24,.10)', basemap:'voyager' },
  citymapper: { name:'Citymapper', primary:'#37ab2f', hover:'#2e9127', onPrimary:'#fff', canvas:'#fff',
    surface:'#f6f6f6', fg:'#383838', body:'#4a4a4a', muted:'#8b8b8b', border:'#e8e8e8',
    danger:'#d22020', tint:'#e9f3ff', rCard:'20px', rBtn:'20px', rChip:'96px',
    shadow:'0 4px 18px rgba(0,0,0,.12)', basemap:'positron' },
  karrot: { name:'당근', primary:'#ff6f0f', hover:'#e55f00', onPrimary:'#fff', canvas:'#fff',
    surface:'#f7f8fa', fg:'#212124', body:'#4d5159', muted:'#868b94', border:'#eaebee',
    danger:'#fa2314', tint:'#fff5f0', rCard:'8px', rBtn:'6px', rChip:'9999px',
    shadow:'0 3px 16px rgba(0,0,0,.08)', basemap:'positron' },
};
const BASEMAPS = {
  positron:'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
  voyager:'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
};

let map, current = 'toss', stops = [];

function applyTheme(key) {
  const t = THEMES[key], r = document.documentElement.style;
  r.setProperty('--primary', t.primary); r.setProperty('--primary-hover', t.hover);
  r.setProperty('--on-primary', t.onPrimary); r.setProperty('--canvas', t.canvas);
  r.setProperty('--surface', t.surface); r.setProperty('--fg', t.fg); r.setProperty('--body', t.body);
  r.setProperty('--muted', t.muted); r.setProperty('--border', t.border); r.setProperty('--danger', t.danger);
  r.setProperty('--tint', t.tint); r.setProperty('--r-card', t.rCard); r.setProperty('--r-btn', t.rBtn);
  r.setProperty('--r-chip', t.rChip); r.setProperty('--shadow', t.shadow);
  document.querySelectorAll('#switcher button').forEach(b => b.classList.toggle('on', b.dataset.t === key));
  if (map) {
    const style = BASEMAPS[t.basemap];
    if (style !== BASEMAPS[THEMES[current].basemap] || !map.getSource('route')) {
      map.setStyle(style); map.once('styledata', drawRoute);
    } else { drawRoute(); }
  }
  current = key;
}

function dist(a, b) {
  const R = 6371, rad = d => d * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

function renderList() {
  let total = 0;
  document.getElementById('list').innerHTML = stops.map((s, i) => {
    const seg = i === 0 ? 0 : dist(stops[i-1], s);
    total += seg;
    const edge = (i === 0 || i === stops.length - 1) ? ' edge' : '';
    return `<div class="item${edge}">
      <span class="grip">⠿</span>
      <span class="num">${i === 0 ? '출' : (i === stops.length - 1 ? '골' : i + 1)}</span>
      <span class="nm">${s.name}</span>
      <span class="seg">${total.toFixed(1)}km</span>
      <span class="x">✕</span>
    </div>`;
  }).join('');
  document.getElementById('s-km').innerHTML = total.toFixed(1) + '<small>km</small>';
  document.getElementById('s-n').textContent = stops.length;
}

function koreanLabels() {
  map.getStyle().layers.filter(l => l.type === 'symbol').forEach(l => {
    try { map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get','name:ko'], ['get','name']]); } catch (e) {}
  });
}

function drawRoute() {
  koreanLabels();
  if (!stops.length) return;
  const t = THEMES[current];
  const line = { type:'Feature', geometry:{ type:'LineString', coordinates: stops.map(s => [s.lng, s.lat]) } };
  const pts = { type:'FeatureCollection', features: stops.map((s, i) => ({
    type:'Feature', properties:{ edge: i === 0 || i === stops.length - 1 }, geometry:{ type:'Point', coordinates:[s.lng, s.lat] } })) };

  if (map.getLayer('route-pts')) map.removeLayer('route-pts');
  if (map.getLayer('route-line')) map.removeLayer('route-line');
  if (map.getLayer('route-casing')) map.removeLayer('route-casing');
  if (map.getSource('route')) map.removeSource('route');
  if (map.getSource('pts')) map.removeSource('pts');

  map.addSource('route', { type:'geojson', data: line });
  map.addSource('pts', { type:'geojson', data: pts });
  map.addLayer({ id:'route-casing', type:'line', source:'route',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color': t.canvas, 'line-width': 9, 'line-opacity': .9 } });
  map.addLayer({ id:'route-line', type:'line', source:'route',
    layout:{ 'line-cap':'round', 'line-join':'round' },
    paint:{ 'line-color': t.primary, 'line-width': 5 } });
  map.addLayer({ id:'route-pts', type:'circle', source:'pts',
    paint:{ 'circle-radius':['case',['get','edge'],7,4.5],
            'circle-color':['case',['get','edge'], t.primary, t.canvas],
            'circle-stroke-color': t.primary, 'circle-stroke-width':2.5 } });

  document.querySelectorAll('.pin-marker').forEach(m => m.remove());
  const mk = (s, label, cls) => {
    const el = document.createElement('div');
    el.className = 'pin-marker';
    el.innerHTML = `<div class="pin ${cls}"><i></i>${label}</div>`;
    new maplibregl.Marker({ element: el, anchor:'bottom' }).setLngLat([s.lng, s.lat]).addTo(map);
  };
  mk(stops[0], '출발 · 상암월드컵공원', '');
  mk(stops[stops.length - 1], '골인 · 여의도공원', 'finish');
}

fetch('/backups/marathon-routes-latest.json')
  .then(r => r.json())
  .then(d => {
    const route = d.routes.find(r => r.name.includes('마라톤')) || d.routes[0];
    stops = route.stops;
    renderList();
    const lats = stops.map(s => s.lat), lngs = stops.map(s => s.lng);
    map = new maplibregl.Map({
      container:'map', style: BASEMAPS.positron,
      bounds: [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
      fitBoundsOptions:{ padding:{ top:110, bottom:90, left:90, right:400 } },
      attributionControl:{ compact:true },
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-left');
    map.on('load', drawRoute);
  });

document.querySelectorAll('#switcher button').forEach(b =>
  b.addEventListener('click', () => applyTheme(b.dataset.t)));
</script>
</body>
</html>
